<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070912"/>
      <stop offset="1" stop-color="#0e1330"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#37e6d4"/>
      <stop offset="0.55" stop-color="#8b6cff"/>
      <stop offset="1" stop-color="#ff5d9e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#8b6cff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8b6cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#glow)"/>

  <!-- geometric motif: a coordinate grid + a shape being tokenized -->
  <g opacity="0.5" transform="translate(880 60)">
    <g stroke="#2a3358" stroke-width="1">
      <path d="M0 0 H260 M0 52 H260 M0 104 H260 M0 156 H260 M0 208 H260 M0 240 H260"/>
      <path d="M0 0 V240 M52 0 V240 M104 0 V240 M156 0 V240 M208 0 V240 M260 0 V240"/>
    </g>
    <!-- a path/icon over the grid -->
    <path d="M40 180 C 40 90, 220 90, 220 180 C 220 240, 40 240, 40 180 Z"
          fill="none" stroke="url(#grad)" stroke-width="3"/>
    <circle cx="40" cy="180" r="6" fill="#37e6d4"/>
    <circle cx="130" cy="110" r="6" fill="#8b6cff"/>
    <circle cx="220" cy="180" r="6" fill="#ff5d9e"/>
  </g>

  <!-- wordmark -->
  <text x="72" y="118" font-size="72" font-weight="800" letter-spacing="-2" fill="#ffffff">Geom<tspan fill="url(#grad)">Tok</tspan></text>
  <text x="74" y="162" font-size="24" font-weight="600" fill="#aeb6d6">Geometry-native tokenization for vector graphics</text>
  <text x="74" y="196" font-size="16" fill="#7a83a8">The unit a model reads geometry in is not a free choice.</text>

  <!-- stat chips -->
  <g font-weight="700">
    <g transform="translate(74 232)">
      <rect width="172" height="64" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#2a3358"/>
      <text x="16" y="30" font-size="26" fill="#37e6d4">100%</text>
      <text x="16" y="50" font-size="12" font-weight="500" fill="#8b93b0">parse + round-trip</text>
    </g>
    <g transform="translate(262 232)">
      <rect width="172" height="64" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#2a3358"/>
      <text x="16" y="30" font-size="26" fill="#8b6cff">3.54×</text>
      <text x="16" y="50" font-size="12" font-weight="500" fill="#8b93b0">vs domain text BPE</text>
    </g>
    <g transform="translate(450 232)">
      <rect width="172" height="64" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#2a3358"/>
      <text x="16" y="30" font-size="26" fill="#ff5d9e">0 added</text>
      <text x="16" y="50" font-size="12" font-weight="500" fill="#8b93b0">vocab coord codec</text>
    </g>
    <g transform="translate(638 232)">
      <rect width="172" height="64" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#2a3358"/>
      <text x="16" y="30" font-size="26" fill="#54e08a">251</text>
      <text x="16" y="50" font-size="12" font-weight="500" fill="#8b93b0">tests · Apache-2.0</text>
    </g>
  </g>
</svg>
