<text x="588" y="219" font-size="11" fill="#444">FSA-constrained →</text>
<text x="588" y="235" font-size="11" fill="#444">valid SVG</text>
<text x="588" y="251" font-size="11" fill="#444">(bounded-error)</text>
<text x="30" y="310" font-size="13" font-weight="700" fill="#111">Same icon, two token streams</text>
<text x="30" y="334" font-size="12" fill="#a23" font-family="monospace">text BPE:  &lt; s v g _ v i e w B o x = " 0 …  ›  meaningless character fragments</text>
<text x="30" y="356" font-size="12" fill="#1a9b8e" font-family="monospace">GeomTok:  ⟨BOS⟩ MOVE ● LINE ● ● ⟨G0⟩ CLOSE  CIRCLE ●center ●r  ⟨EOS⟩</text>
<text x="30" y="380" font-size="11.5" fill="#666">● = one coordinate/scalar token. Across 400 real icons: 935 → 264 tokens/icon (3.54× at matched 5,561 vocab, §5.1).</text>
</svg>