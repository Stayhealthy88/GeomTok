<text x="224" y="235" font-size="11" fill="#444">+ fixed-point codec</text>
<text x="224" y="251" font-size="11" fill="#444">(0.04px, §3.2)</text>
<path d="M374 223 l14 0 m-5 -5 l5 5 l-5 5" stroke="#bbb" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="394" y="175" width="158" height="96" rx="12" fill="#fff" stroke="#ffc857" stroke-width="1.6"/>
<rect x="394" y="175" width="158" height="26" rx="12" fill="#ffc857" opacity="0.16"/>
<text x="406" y="193" font-size="12.5" font-weight="800" fill="#ffc857" letter-spacing="0.05em">TOKENIZE</text>
<text x="406" y="219" font-size="11" fill="#444">commands · shapes ·</text>
<text x="406" y="235" font-size="11" fill="#444">coordinates →</text>
<text x="406" y="251" font-size="11" fill="#444">5,561 vocab</text>
<path d="M556 223 l14 0 m-5 -5 l5 5 l-5 5" stroke="#bbb" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="576" y="175" width="158" height="96" rx="12" fill="#fff" stroke="#ff5d9e" stroke-width="1.6"/>
<rect x="576" y="175" width="158" height="26" rx="12" fill="#ff5d9e" opacity="0.16"/>
