<text x="179" y="101" font-size="12" font-family="monospace" fill="#1a9b8e" text-anchor="middle">COORD@cell(32,17)</text>
<text x="250" y="101" font-size="11.5" fill="#999">1 token · a point in space (fixed-point codec, §3.2)</text>
<rect x="30" y="175" width="158" height="96" rx="12" fill="#fff" stroke="#8b6cff" stroke-width="1.6"/>
<rect x="30" y="175" width="158" height="26" rx="12" fill="#8b6cff" opacity="0.16"/>
<text x="42" y="193" font-size="12.5" font-weight="800" fill="#8b6cff" letter-spacing="0.05em">PARSE</text>
<text x="42" y="219" font-size="11" fill="#444">flatten transforms,</text>
<text x="42" y="235" font-size="11" fill="#444">norm viewBox,</text>
<text x="42" y="251" font-size="11" fill="#444">drop defs</text>
