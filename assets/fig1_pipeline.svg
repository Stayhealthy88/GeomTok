<rect x="212" y="175" width="158" height="96" rx="12" fill="#fff" stroke="#37e6d4" stroke-width="1.6"/>
<rect x="212" y="175" width="158" height="26" rx="12" fill="#37e6d4" opacity="0.16"/>
<text x="224" y="193" font-size="12.5" font-weight="800" fill="#37e6d4" letter-spacing="0.05em">QUANTIZE</text>
